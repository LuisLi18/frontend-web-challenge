server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: cualquier ruta no-archivo va a index.html
  # → React Router maneja el routing client-side
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Assets con hash (Vite los genera con [name]-[hash].ext) → cache infinito.
  # Al deployar nueva versión, el hash cambia y el browser pide la nueva.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html nunca se cachea → siempre lee la última versión
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Compresión
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    image/svg+xml;

  # Seguridad básica
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Oculta versión de nginx
  server_tokens off;
}
